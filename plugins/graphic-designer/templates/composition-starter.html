<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!--
  Kompozycja startowa. Skopiuj ją do composition/<id-formatu>.html (np. ig-post.html)
  i zmieniaj. Skrypt sam dodaje: fonty marki, zmienne kolorów --color-<rola>
  i rozmiar strony. Nie wpisuj ich tutaj.
-->
<style>
  /* Tło: kolor marki. Gdy masz zamrożoną warstwę tła, zamień ten blok na <img> poniżej. */
  body { background: var(--color-background); position: relative; }

  /* Logo bierzemy z biblii marki: przedrostek „brand:” i ścieżka względem folderu brand/. */
  .logo { position: absolute; left: 80px; top: 80px; width: 320px; }

  /* Teksty: data-gd="text". Rodzinę fontu zmień na rodzinę z biblii marki,
     np. font-family: "Anton", sans-serif; */
  .title { position: absolute; left: 80px; top: 600px; width: 920px;
           font-family: sans-serif; font-weight: 700; font-size: 110px; line-height: 1.05;
           color: var(--color-text); }
  .subtitle { position: absolute; left: 80px; top: 960px; width: 920px;
              font-family: sans-serif; font-size: 48px; color: var(--color-primary); }
</style>
</head>
<body>
  <!-- Warstwa z pliku (zamrożona w layers/): odkomentuj i dopasuj nazwę pliku.
  <img data-gd="layer" src="../layers/tlo.png" style="position:absolute;left:0;top:0;width:100%;height:100%">
  -->
  <img class="logo" data-gd="logo" src="brand:logo/full.png" alt="logo">
  <div class="title" data-gd="text" id="title">Tytuł plakatu</div>
  <div class="subtitle" data-gd="text" id="subtitle">Data, miejsce, krótka zachęta</div>
</body>
</html>
