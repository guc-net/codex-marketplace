name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  testy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testy (manifesty, skrypt, strona na fixture)
        run: python -m unittest discover -s tests -v
      - name: Strona z fixture przez CLI
        shell: bash
        run: |
          cp -r tests/fixture/przyklad "$RUNNER_TEMP/przyklad"
          python plugins/komiks/scripts/komiks.py strona --komiks "$RUNNER_TEMP/przyklad"
          python plugins/komiks/scripts/komiks.py sprawdz --komiks "$RUNNER_TEMP/przyklad"
